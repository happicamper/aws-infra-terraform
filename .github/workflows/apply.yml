name: Terraform Apply (main)

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # =====================================================================
  # 1. NETWORK — VPC, subnets, IGW, NAT Gateway, route tables
  # =====================================================================
  network-apply:
    runs-on: ubuntu-latest
    environment: demo
    defaults:
      run:
        working-directory: environments/dev/network
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEMO_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  # =====================================================================
  # 2. COMPUTE
  # =====================================================================
  compute-apply:
    needs: network-apply
    runs-on: ubuntu-latest
    environment: demo
    defaults:
      run:
        working-directory: environments/dev/compute
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEMO_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  # =====================================================================
  # 3. EDGE 
  # =====================================================================
  edge-apply:
    needs: compute-apply
    runs-on: ubuntu-latest
    environment: demo
    defaults:
      run:
        working-directory: environments/dev/edge
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEMO_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplans

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve